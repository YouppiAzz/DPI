<div class="flex items-center justify-between px-8 py-6">

  <p class="font-bold text-[24px]">{{pageName}}</p>

  <div class="relative w-1/3">
    <div class="flex items-center" *ngIf="isSearchActive">
      <input
        (input)="onSearch($event)"
        type="text"
        placeholder="Rechercher un dossier..."
        class="w-full px-4 py-2 pl-10 bg-gray-100 border rounded-full focus:outline-none focus:ring-2 focus:ring-[#5DADE2] focus:border-transparent">
      <ng-icon
        name="dripSearch"
        class="absolute left-3 text-gray-400 text-[20px]"
      />
    </div>
  </div>

  <div class="flex items-center gap-x-[24px]">
    <ng-icon name="dripBell" class="text-[20px] cursor-pointer"/>
    <button class="flex items-center gap-x-[6px]">
      <img src="assets/img/user.svg" alt="user img">
        <div>
          <p class="font-medium text-[16px]">Amine Douba</p>
          <p class="font-regular opacity-50 text-[12px]">Administrateur</p>
        </div>
    </button>
  </div>

</div>
