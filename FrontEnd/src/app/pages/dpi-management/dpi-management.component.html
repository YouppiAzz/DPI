<div class="flex flex-col h-screen"> <!-- Changed to h-screen -->
  <app-header></app-header>
  <div class="flex-1 px-2 overflow-hidden"> <!-- Added overflow-hidden -->
    <p class="py-6 text-center text-[#575757] text-[24px] w-[100%]">Créez un nouveau dossier, recherchez un dossier existant, consultez le ou modifiez le facilement</p>
    <div class="flex items-center justify-between px-12">
      <div>
        <p class="font-medium text-[28px] text-center">{{count}}</p>
        <p class="font-regular opacity-75 text-[16px]">Dossiers</p>
      </div>
      <button class="ease-in-out duration-200 bg-[#5DADE2] text-white hover:bg-white hover:text-[#5DADE2] rounded-[10px] text-[20px] px-8 py-[10px]">Nouveau Dossier</button>
    </div>
    <div class="bg-white rounded-[16px] mt-6 px-8 h-[calc(100%-190px)]"> <!-- Adjusted margin-top and height calculation -->
      <div class="flex justify-around text-[#6A6A6A] pt-3 border-b-[2px] border-[#BFBFBF]">
        <p>Nom</p>
        <p>Prénom</p>
        <p>Date de création</p>
        <p>Dernier modifié</p>
        <p>Médecin</p>
      </div>
      <div class="flex flex-col items-center justify-center h-[calc(100%-48px)] text-[#6A6A6A] text-[20px] gap-y-[15px] leading-none"> <!-- Adjusted height for the content area -->
        <p>Aucun dossier patient disponible.</p>
        <p>Cliquez sur 'Nouveau Dossier' pour commencer</p>
        <img src="assets/img/foldericon.svg" alt="">
      </div>
    </div>
  </div>
</div>
