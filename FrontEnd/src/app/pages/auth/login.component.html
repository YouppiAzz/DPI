<div class="min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-lg shadow-md">
      
      <!-- Header -->
        <div class="text-center">
          <h2 class="text-3xl font-bold text-gray-900">Connectez vous à votre compte</h2>
          <p class="mt-2 text-sm text-gray-600">
            Ou
            <a routerLink="/home" class="font-medium text-[#5DADE2] hover:text-[#5DADE2]">
              créez un nouveau compte
            </a>
          </p>
        </div>

        <!-- Login Form -->
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="mt-8 space-y-6">
          <div class="space-y-4">
            <!-- Email Field -->
            <div>
              <label for="email" class="block text-sm font-medium text-gray-700">
                Email
              </label>
              <div class="mt-1">
                <input
                  id="email"
                  type="email"
                  formControlName="email"
                  required
                  class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-[#5DADE2] focus:border-[#5DADE2]"
                />
              </div>
              <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" 
                  class="mt-1 text-sm text-red-600">
                *Entrer une adresser email valide
              </div>
            </div>

            <!-- Password Field -->
            <div>
              <label for="password" class="block text-sm font-medium text-gray-700">
                Mot de passe
              </label>
              <div class="mt-1">
                <input
                  id="password"
                  type="password"
                  formControlName="password"
                  required
                  class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-[#5DADE2] focus:border-[#5DADE2]"
                />
              </div>
              <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
                  class="mt-1 text-sm text-red-600">
                *Champ obligatoire
              </div>
            </div>
          </div>

          <!-- Remember Me & Forgot Password -->
          <div class="flex items-center justify-between">
            <div class="flex items-center">
              <input
                id="remember-me"
                type="checkbox"
                formControlName="rememberMe"
                class="h-4 w-4 text-[#5DADE2] focus:ring-[#5DADE2] border-gray-300 rounded"
              />
              <label for="remember-me" class="ml-2 block text-sm text-gray-900">
                Se rappeler de moi
              </label>
            </div>

            <div class="text-sm">
              <a href="#" class="font-medium text-[#5DADE2] hover:text-[#5DADE2]">
                Mot de passe oublié?
              </a>
            </div>
          </div>

          <!-- Submit Button -->
          <div>
            <button
              type="submit"
              [disabled]="loginForm.invalid || isLoading"
              class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-[#5DADE2] hover:bg-[#5DADE2] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#5DADE2] disabled:opacity-50"
            >
              <span *ngIf="!isLoading">Se connecter</span>
              <span *ngIf="isLoading">Loading...</span>
            </button>
          </div>

          <!-- Error Message -->
          <div *ngIf="errorMessage" class="mt-2 text-sm text-red-600 text-center">
            {{ errorMessage }}
          </div>
        </form>

    </div>
  </div>
