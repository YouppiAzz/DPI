<div class="flex flex-col h-screen">
  <app-header [pageName]="'Dossiers Patients'"></app-header>
  <div class="flex-1 px-2 overflow-hidden">     <p class="py-6 text-center text-[#575757] text-[24px] w-[100%]">Créez un nouveau dossier, recherchez un dossier existant, consultez le ou modifiez le facilement</p>
    <div class="flex items-center justify-between px-12">
      <div>
        <p class="font-medium text-[28px] text-center">{{count}}</p>
        <p class="font-regular opacity-75 text-[16px]">Dossiers</p>
      </div>
      <a routerLink="/dpi-management/creer-dossier" class="ease-in-out duration-200 bg-[#5DADE2] text-white hover:bg-[#4a8cb3] rounded-[10px] text-[20px] px-8 py-[10px]">Nouveau Dossier</a>
    </div>
    <div class="bg-white rounded-[16px] mt-6 px-8 h-[calc(100%-190px)] overflow-hidden">
      <div class="flex py-4 text-[#6A6A6A] border-b border-gray-200">
        <p class="w-[20%]">Nom</p>
        <p class="w-[20%]">Prénom</p>
        <p class="w-[20%]">Date de création</p>
        <p class="w-[20%]">Dernier modifié</p>
        <p class="w-[20%]">Médecin</p>
      </div>
      <div *ngIf="dossiers.length === 0; else dossiersList" class="flex flex-col items-center justify-center h-[calc(100%-48px)] text-[#6A6A6A] text-[20px] gap-y-[15px] leading-none">
        <p>Aucun dossier patient disponible.</p>
        <p>Cliquez sur 'Nouveau Dossier' pour commencer</p>
        <img src="assets/img/foldericon.svg" alt="">
      </div>

      <ng-template #dossiersList>
        <div class="h-[calc(100%-48px)] overflow-y-auto">
          <app-dossier *ngFor="let dossier of filteredDossiers" [dossier]="dossier"></app-dossier>
        </div>
      </ng-template>
    </div>
  </div>
</div>
